<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELA 2 · Term 2 Week 8 · Illustrated Exam Quest</title><style>
:root{--wine:#80132F;--cream:#FFF9F2;--gold:#E8B86D;--ink:#3c2530}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,#fff2b9,transparent 32%),linear-gradient(145deg,#fff1dc,#ffdde6 52%,#d8f3fa);font-family:Trebuchet MS,Arial,sans-serif;color:var(--ink);min-height:100vh;padding:20px}.app{max-width:900px;margin:auto;background:var(--cream);border:4px solid var(--wine);border-radius:28px;overflow:hidden;box-shadow:0 15px 45px #80132f25}.hero{background:linear-gradient(110deg,#80132F,#ad2750);color:white;text-align:center;padding:22px 20px 18px}.eyebrow{font-size:13px;letter-spacing:1px;font-weight:800;color:var(--gold)}h1{font-size:clamp(26px,5vw,43px);margin:8px 0}.hero p{margin:0;color:#ffe8bf}.content{padding:24px}.stats{display:flex;justify-content:space-between;gap:12px;font-weight:800;color:var(--wine)}.track{height:15px;background:#f0dfd6;border-radius:20px;margin:14px 0 20px;overflow:hidden}.track>div{height:100%;width:0;background:linear-gradient(90deg,#f2b84e,#e68d40);transition:width .35s}.scene{position:relative;min-height:175px;overflow:hidden;border-radius:24px;background:linear-gradient(#bcefff,#f5f9d2 68%,#8ad6a0 68%);border:3px solid #f3c56d;display:flex;align-items:center;justify-content:center;margin-bottom:18px}.scene.night{background:linear-gradient(#283b83,#6278b3 68%,#6bbd9b 68%)}.scene .cloud{position:absolute;top:12px;left:12%;font-size:35px;opacity:.75}.scene .spark{position:absolute;top:12px;right:13%;font-size:34px}.scene .hill{position:absolute;bottom:-22px;left:-4%;width:110%;height:67px;background:#69b67e;border-radius:50%}.scene .scene-icons{position:relative;font-size:clamp(56px,11vw,95px);letter-spacing:10px;filter:drop-shadow(0 5px 2px #0002);text-align:center;z-index:1}.scene-label{position:absolute;bottom:9px;right:14px;background:#fff9f2ed;border-radius:18px;padding:5px 12px;color:#80132F;font-size:12px;font-weight:800;z-index:2}.question{font-size:clamp(21px,3vw,28px);color:var(--wine);line-height:1.32;margin:16px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 18px}.mini,.nav{font-family:inherit;cursor:pointer;border:2px solid var(--wine);color:var(--wine);background:#fff;border-radius:12px;padding:10px 15px;font-weight:800}.mini:hover,.nav:hover{background:#ffe7b6}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{cursor:pointer;display:flex;align-items:center;gap:14px;border:3px solid #e8cbbd;background:#fff;border-radius:19px;padding:14px;min-height:94px;text-align:left;font:700 17px/1.35 Trebuchet MS,Arial,sans-serif;color:var(--ink);transition:transform .14s,box-shadow .14s}.choice:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 7px 0 #e9d0bb}.choice:disabled{cursor:default}.choice .art{width:65px;min-width:65px;height:65px;border-radius:16px;background:linear-gradient(135deg,#fce9a9,#ffcfda);display:grid;place-items:center;font-size:38px;border:2px solid #fff;box-shadow:0 0 0 2px #f0d7a6}.choice .letter{font-size:13px;color:var(--wine);display:block;margin-bottom:4px}.choice.correct{background:#e5f8e7;border-color:#3c9656}.choice.wrong{background:#ffe7e7;border-color:#d64b58}.feedback{min-height:32px;margin:15px 0;font-weight:800;font-size:17px}.feedback.good{color:#267340}.feedback.bad{color:#a42e44}.navrow{display:flex;gap:10px;justify-content:space-between;align-items:center}.nav.primary{background:var(--wine);color:#fff;border-color:var(--wine);padding:13px 23px}.nav.primary:hover{background:#a3224c}.foot{font-size:12px;color:#79666d;margin:18px 0 0;text-align:center}.result{text-align:center;padding:20px 0}.result h2{font-size:33px;color:var(--wine)}.award{font-size:90px}.review{margin:18px 0;text-align:left}.review-item{padding:12px 14px;border:2px solid #eed9c8;border-radius:14px;margin:8px 0;background:white}.review-item strong{color:var(--wine)}.hidden{display:none!important}@media(max-width:590px){body{padding:7px}.content{padding:15px}.choices{grid-template-columns:1fr}.choice{min-height:78px}.scene{min-height:145px}.scene .scene-icons{letter-spacing:0}.choice .art{width:55px;min-width:55px;height:55px;font-size:33px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="app"><header class="hero"><div class="eyebrow">WPA ELA 2 • TERM 2 • WEEK 8</div><h1>📚 Illustrated Exam Quest ⭐</h1><p>Read • Look • Think • Choose • Shine!</p></header><div class="content"><div id="quiz"><div class="stats"><span id="count"></span><span id="score"></span></div><div class="track" aria-label="Quiz progress"><div id="fill"></div></div><div class="scene" id="scene" role="img" aria-label="Friendly illustration connected to the question"><span class="cloud" aria-hidden="true">☁️</span><span class="spark" aria-hidden="true">✨</span><span class="hill" aria-hidden="true"></span><span class="scene-icons" id="sceneIcons" aria-hidden="true"></span><span class="scene-label" id="sceneLabel"></span></div><h2 class="question" id="question"></h2><div class="actions"><button class="mini" onclick="speak()">🔊 Read question and choices</button><button class="mini" onclick="stopSpeak()">🔇 Stop reading</button></div><div class="choices" id="options"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="navrow"><button class="nav" id="prev" onclick="previous()">← Previous</button><button class="nav primary" id="next" onclick="next()" disabled>Next Mission →</button></div></div><div class="result hidden" id="result"><div class="award">🏆</div><h2>You're an ELA Star!</h2><p id="resultScore"></p><p id="resultMsg"></p><button class="nav primary" onclick="restart()">🔁 Play Again</button><h3>Review Your Answers</h3><div class="review" id="review"></div></div><p class="foot">Practice game only. Results are not automatically sent to Canvas LMS.</p></div></main><script>
const questions=[{"q": "What does hatch mean?", "options": ["Come out of an egg", "Go to sleep", "Climb a tree", "Make a nest"], "answer": 0}, {"q": "Which word means something that makes you afraid?", "options": ["gentle", "scary", "tiny", "silent"], "answer": 1}, {"q": "What is a narrator?", "options": ["A place", "A storyteller", "A kind of animal", "A title"], "answer": 1}, {"q": "What does predator mean?", "options": ["An animal that hunts other animals", "A baby animal", "A plant", "A safe place"], "answer": 0}, {"q": "What does rushed mean?", "options": ["Moved slowly", "Moved quickly", "Stayed still", "Fell asleep"], "answer": 1}, {"q": "Which word names a place?", "options": ["forest", "jump", "scary", "soft"], "answer": 0}, {"q": "What is a reason in writing?", "options": ["A spelling mistake", "An explanation of why", "A picture", "The title only"], "answer": 1}, {"q": "What does revise mean?", "options": ["Improve ideas in writing", "Close the book", "Count the pages", "Copy every word"], "answer": 0}, {"q": "Choose the correctly spelled word.", "options": ["turtel", "turtle", "tertle", "turtul"], "answer": 1}, {"q": "Choose the correctly spelled word.", "options": ["monstor", "munster", "monster", "monstir"], "answer": 2}, {"q": "Choose the correctly spelled word.", "options": ["becaus", "because", "becose", "becausse"], "answer": 1}, {"q": "Which word has the same ending sound as bear?", "options": ["chair", "fish", "book", "tree"], "answer": 0}, {"q": "Where did Mia and Leo go?", "options": ["Beach", "Library", "Forest", "School bus"], "answer": 1}, {"q": "When did they visit?", "options": ["Saturday", "Monday", "Friday", "Tuesday"], "answer": 0}, {"q": "What was Mia reading about?", "options": ["Bears", "Monsters", "Sea turtles", "Birds"], "answer": 2}, {"q": "What did Leo choose?", "options": ["A bear book", "A turtle book", "A map", "A poem"], "answer": 0}, {"q": "Yesterday, Ben ___ to school.", "options": ["walk", "walked", "will walk", "walking"], "answer": 1}, {"q": "Tomorrow, I ___ my grandma.", "options": ["visited", "visits", "will visit", "visit yesterday"], "answer": 2}, {"q": "Every day, she ___ a book.", "options": ["read yesterday", "reads", "will read", "reading"], "answer": 1}, {"q": "Which sentence uses future tense correctly?", "options": ["She will goes.", "She will went.", "She will go.", "She going will."], "answer": 2}];const scenes=["🐣🥚🌿", "🌲🌙👀", "📖🗣️💬", "🌳🐾🦊", "🏃💨⏱️", "🏞️🏡🌲", "💭✏️📃", "📝✨📚", "🐢🔤✏️", "👾🔤📖", "💬🔤✏️", "🐻🎵🔊", "👧👦📚", "📅🗓️⏰", "👧📖🌊", "👦📚🐾", "🚶🏫🕰️", "👵🏡📅", "👧📚☀️", "🚀📅✍️"];const icons=[["🐣", "😴", "🌳", "🪺"], ["🌷", "👻", "🐜", "🤫"], ["🏞️", "🗣️", "🐯", "📘"], ["🦊", "🐣", "🌱", "🏠"], ["🐢", "⚡", "🧍", "💤"], ["🌲", "🤸", "😱", "🧸"], ["❌", "💡", "🖼️", "📕"], ["✨", "📕", "🔢", "📋"], ["🐢", "🐢", "🐢", "🐢"], ["👾", "👾", "👾", "👾"], ["✏️", "✏️", "✏️", "✏️"], ["🪑", "🐟", "📖", "🌳"], ["🏖️", "📚", "🌲", "🚌"], ["📅", "📅", "📅", "📅"], ["🐻", "👾", "🐢", "🐦"], ["🐻", "🐢", "🗺️", "📜"], ["🚶", "🚶", "🚶", "🚶"], ["👵", "👵", "👵", "👵"], ["📖", "📖", "📖", "📖"], ["📝", "📝", "📝", "📝"]];let index=0;let selected=Array(questions.length).fill(null);const $=id=>document.getElementById(id);const zones=['Word Explorer','Word Explorer','Story Detective','Animal Facts','Word Explorer','Word Explorer','Writing Workshop','Writing Workshop','Spelling Station','Spelling Station','Spelling Station','Sound Station','Reading Corner','Reading Corner','Reading Corner','Reading Corner','Grammar Garden','Grammar Garden','Grammar Garden','Grammar Garden'];function total(){return selected.reduce((s,a,i)=>s+(a===questions[i].answer?1:0),0)}function render(){let q=questions[index],sel=selected[index];$('count').textContent='Mission '+(index+1)+' / '+questions.length;$('score').textContent='⭐ '+(total()*5)+' / 100';$('fill').style.width=(selected.filter(x=>x!==null).length/questions.length*100)+'%';$('question').textContent=q.q;$('sceneIcons').textContent=scenes[index];$('sceneLabel').textContent=zones[index];$('scene').classList.toggle('night',[1,9,13,19].includes(index));$('scene').setAttribute('aria-label','Illustrated learning scene for '+zones[index]);$('options').innerHTML='';q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='choice';b.type='button';b.disabled=sel!==null;let a=document.createElement('span');a.className='art';a.textContent=icons[index][j];a.setAttribute('aria-hidden','true');let label=document.createElement('span');let l=document.createElement('span');l.className='letter';l.textContent='CHOICE '+ 'ABCD'[j];label.append(l,document.createTextNode(o));b.append(a,label);if(sel!==null){if(j===q.answer)b.classList.add('correct');else if(j===sel)b.classList.add('wrong')}b.onclick=()=>choose(j);$('options').append(b)});$('feedback').textContent=sel===null?'Choose the best answer. Look at the pictures for helpful context!':sel===q.answer?'🌟 Great job! That is correct.':'💡 The correct answer is '+ 'ABCD'[q.answer]+'. '+q.options[q.answer];$('feedback').className='feedback '+(sel===null?'':sel===q.answer?'good':'bad');$('prev').disabled=index===0;$('next').disabled=sel===null;$('next').textContent=index===questions.length-1?'See My Award 🏆':'Next Mission →'}function choose(j){if(selected[index]!==null)return;selected[index]=j;render()}function previous(){if(index>0){stopSpeak();index--;render()}}function next(){if(selected[index]===null)return;stopSpeak();if(index===questions.length-1){showResults()}else{index++;render()}}function showResults(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('resultScore').textContent='You earned '+(total()*5)+' out of 100 points ('+total()+' correct out of '+questions.length+').';$('resultMsg').textContent=total()===questions.length?'Amazing! Every mission completed!':'Great effort! Read your answers below and keep practising.';$('review').innerHTML='';questions.forEach((q,i)=>{let box=document.createElement('div');box.className='review-item';let h=document.createElement('strong');h.textContent=(i+1)+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(selected[i]===null?'Not answered':q.options[selected[i]])+' '+(selected[i]===q.answer?'✓':'✗');let c=document.createElement('p');c.textContent='Correct answer: '+q.options[q.answer];box.append(h,p,c);$('review').append(box)});window.scrollTo({top:0,behavior:'smooth'})}function restart(){stopSpeak();selected=Array(questions.length).fill(null);index=0;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel()}function speak(){if(!('speechSynthesis' in window)){alert('Read-aloud is unavailable in this browser.');return}stopSpeak();let q=questions[index];let u=new SpeechSynthesisUtterance(q.q+'. '+q.options.map((x,i)=>'Option '+ 'ABCD'[i]+': '+x).join('. '));u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}render();
</script></body></html>
